apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
---
# Cilium's Gateway: Hostman gives it one load balancer for the apps (80/443) and k8gb's DNS (53/TCP).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Only https-redirect.yaml attaches here: every site answers http:// with a 301 to https://.
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${CLUSTER_DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: cluster-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-site
      protocol: HTTPS
      port: 443
      hostname: "${SITE_HOST}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: site-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: dns
      protocol: TCP
      port: 53
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
