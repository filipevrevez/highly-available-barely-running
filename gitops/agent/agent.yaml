apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-agent
  namespace: flux-system
spec:
  interval: 30m
  releaseName: metrics-agent
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    defaultRules:
      create: false # an agent evaluates no rules
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    # The managed control plane and kube-proxy (Cilium replaces it) are not scrapeable here.
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      agentMode: true
      prometheusSpec:
        scrapeInterval: 15s
        externalLabels:
          cluster: ${CLUSTER_NAME}
        remoteWrite:
          - url: ${METRICS_REMOTE_WRITE_URL}
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            memory: 512Mi
