apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns
---
# Publishes HTTPRoute hostnames under this cluster's domain as Cloudflare records pointing at the
# Gateway's load balancer IP. Shared names (k8gb's zone, the site) are left to k8gb.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  releaseName: external-dns
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: token
    sources:
      - gateway-httproute
    # Only this cluster's subdomain; shared names like k8gb's zone are left alone.
    domainFilters:
      - ${CLUSTER_DOMAIN}
    policy: sync
    registry: txt
    txtOwnerId: ${CLUSTER_NAME}
    txtPrefix: external-dns-
    # The provider drops zones outside domainFilters, and CLUSTER_DOMAIN is below PARENT_ZONE: name the zone by ID.
    extraArgs:
      - --zone-id-filter=${DNS_ZONE_ID}
