apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      enabled: false
    prometheus:
      # The site clusters remote-write here over the private network: NodePort 30090 on the
      # node's private address (Cilium serves node ports only on the private interface).
      service:
        type: NodePort
        nodePort: 30090
      prometheusSpec:
        enableRemoteWriteReceiver: true
        # Pick up ServiceMonitors and Probes from any namespace, not only the chart's own.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 3d
        # No storageSpec: the TSDB lives in an emptyDir on the node and is lost with the pod.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
    grafana:
      admin:
        existingSecret: grafana-admin # generated by Terraform (terraform/control.tf)
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      sidecar:
        dashboards:
          multicluster:
            global:
              enabled: true # a cluster picker on the built-in dashboards (this cluster plus the site clusters)
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: ${GATEWAY_NAME:=public}
      namespace: ${GATEWAY_NAMESPACE:=gateway-system}
  hostnames:
    - ${GRAFANA_HOST}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
