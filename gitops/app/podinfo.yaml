# /api/info answers with this cluster's message and colour; the phone page shows them.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
spec:
  interval: 24h
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  interval: 30m
  chart:
    spec:
      chart: podinfo
      version: 6.17.0
      sourceRef:
        kind: HelmRepository
        name: podinfo
  values:
    replicaCount: ${APP_REPLICAS:=2}
    # A ServiceMonitor for the metrics agent (gitops/agent); needs its CRDs, so off unless set.
    serviceMonitor:
      enabled: ${PODINFO_METRICS:=false}
    ui:
      message: ${APP_MESSAGE}
      color: "#${APP_COLOR}" # APP_COLOR without "#": kustomize drops these quotes before substitution
