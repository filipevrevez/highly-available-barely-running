apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-remote
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: chaos-remote
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: chaos-remote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: chaos-remote
    namespace: kube-system
