# k8gb's DNS over TCP on the public Gateway's port 53 (listener "dns", gitops/config/gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: k8gb-dns
  namespace: k8gb
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: dns
  rules:
    - backendRefs:
        - name: k8gb-coredns
          port: 53
