apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8gb
  namespace: flux-system
spec:
  interval: 24h
  url: https://www.k8gb.io
---
# k8gb: Cloudflare delegates GSLB_ZONE (NS + glue written by k8gb's embedded external-dns) to
# GSLB_DNS_IP, the dnsdist front from OpenTofu, which forwards over TCP to each Gateway's port 53.
# Namespace and Cloudflare token Secret come from OpenTofu.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8gb
  namespace: flux-system
spec:
  interval: 30m
  releaseName: k8gb
  targetNamespace: k8gb
  chart:
    spec:
      chart: k8gb
      version: v1.0.1
      sourceRef:
        kind: HelmRepository
        name: k8gb
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    k8gb:
      dnsZones:
        - parentZone: ${PARENT_ZONE}
          loadBalancedZone: ${GSLB_ZONE}
          dnsZoneNegTTL: 30
      edgeDNSServers:
        - 1.1.1.1
      # Public address for k8gb's DNS: the dnsdist front. Apps answer with their own Gateway's IP
      # (Gslb annotation k8gb.io/exposed-ip-addresses).
      clusterExposedIPs:
        - ${GSLB_DNS_IP}
      clusterGeoTag: ${GEO_TAG}
      # Cloudflare rejects TTLs under 60s (k8gb's default is 30).
      nsRecordTTL: 60
      extGslbClustersGeoTags: ${PEER_GEO_TAGS}
    coredns:
      serviceType: ClusterIP
    extdns:
      enabled: true
      provider:
        name: cloudflare
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: token
      domainFilters:
        - ${PARENT_ZONE}
      txtPrefix: k8gb-${GEO_TAG}-
      txtOwnerId: k8gb-${GEO_TAG}
